<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deluxe • Spotify</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><span class="brand">DELUXE / MUSIC</span><button id="logout" hidden>Sair</button></header><h1>Sua música.<br>Seu Spotify.</h1><p class="intro">Reprodução oficial na sua conta Premium.</p><div id="status" role="status" aria-live="polite">Preparando conexão…</div><button id="login" class="primary" disabled>Entrar com Spotify</button><section id="player" hidden><form id="search"><label for="query">Encontre sua próxima música</label><div class="search"><input id="query" placeholder="Música ou artista" required minlength="3" maxlength="100"><button class="primary">Buscar</button></div></form><div id="tracks"></div><footer><p id="now">Escolha uma música para começar.</p><div class="controls"><button id="previous">Anterior</button><button id="toggle">Play / Pause</button><button id="next">Próxima</button></div><label>Volume <input id="volume" type="range" min="0" max="100" value="50"></label></footer></section><small>Este player toca nesta conta e neste navegador. Não transmite áudio para outros jogadores.</small></main></body></html>
